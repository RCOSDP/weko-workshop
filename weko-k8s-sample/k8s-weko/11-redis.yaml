# Redis (weko-k8s uses Sentinel; simplified here to a standalone redis, handled by CACHE_TYPE=redis)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: weko3
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      nodeSelector: { nodeType: DATA }
      containers:
      - name: redis
        image: redis:6.2
        args: ["--save","","--appendonly","no"]
        ports:
        - containerPort: 6379
        resources:
          requests: { memory: "128Mi", cpu: "50m" }
          limits:   { memory: "512Mi", cpu: "1" }
        readinessProbe:
          exec: { command: ["redis-cli","ping"] }
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: weko3
spec:
  selector: { app: redis }
  ports:
  - port: 6379
    targetPort: 6379
