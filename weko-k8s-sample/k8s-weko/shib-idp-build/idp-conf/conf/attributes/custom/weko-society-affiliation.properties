# WEKO のロール決定に使う属性 / the attribute WEKO uses to decide the user's role.
# SP 側で HTTP_WEKOSOCIETYAFFILIATION として WEKO に渡り、weko-accounts の
# WEKO_ACCOUNTS_SHIB_ROLE_RELATION (管理者/図書館員/教員/教官) で WEKO ロールに変換される。
# On the SP side this reaches WEKO as HTTP_WEKOSOCIETYAFFILIATION and is translated into a WEKO role by
# weko-accounts' WEKO_ACCOUNTS_SHIB_ROLE_RELATION (管理者/図書館員/教員/教官).
id=wekoSocietyAffiliation
transcoder=SAML2StringTranscoder
saml2.name=urn:oid:1.3.6.1.4.1.32264.2.1.6
displayName.en=WEKO society affiliation
displayName.ja=WEKO 職位
