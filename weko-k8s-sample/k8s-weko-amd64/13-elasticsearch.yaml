# Elasticsearch 6.8.23 — 2-node cluster (amd64 native, sized for a 64GB Gen9)
# Image: weko-elasticsearch:6.8.23 (built from $WEKO_SRC/elasticsearch/Dockerfile; default $WEKO_SRC=$HOME/weko)
#   Based on the official docker.elastic.co image = it has the env→settings entrypoint, so cluster
#   settings can be passed as environment variables.
# heap 6g × 2 nodes, replica=1 spreads shards over both nodes. Raise the heap to hold more items.
apiVersion: v1
kind: ConfigMap
metadata:
  name: es-kui
  namespace: weko3
data:
  kui.txt: ""      # the amd64 weko ES image ships the real kui.txt; this empty ConfigMap is not mounted
                   # The amd64 weko ES ships the real kui.txt, so this empty ConfigMap is not mounted below
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: weko3
spec:
  clusterIP: None
  selector: { app: elasticsearch }
  ports:
  - { name: http, port: 9200, targetPort: 9200 }
  - { name: transport, port: 9300, targetPort: 9300 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: weko3
spec:
  serviceName: elasticsearch
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      nodeSelector: { nodeType: DATA }
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: sysctl
        image: busybox:1.36
        command: ["sh","-c","sysctl -w vm.max_map_count=262144 || true"]
        securityContext: { privileged: true }
      containers:
      - name: elasticsearch
        image: weko-elasticsearch:6.8.23
        imagePullPolicy: Never
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - { name: cluster.name, value: weko-es }
        - { name: node.name, value: "$(NODE_NAME)" }
        - { name: network.host, value: "0.0.0.0" }
        - { name: discovery.zen.ping.unicast.hosts, value: "elasticsearch-0.elasticsearch,elasticsearch-1.elasticsearch" }
        - { name: discovery.zen.minimum_master_nodes, value: "2" }
        - { name: bootstrap.memory_lock, value: "false" }
        - { name: ES_JAVA_OPTS, value: "-Xms2g -Xmx2g" }
        ports:
        - { containerPort: 9200, name: http }
        - { containerPort: 9300, name: transport }
        resources:
          requests: { memory: "2560Mi", cpu: "500m" }
          limits:   { memory: "3Gi", cpu: "3" }
        readinessProbe:
          httpGet: { path: "/_cluster/health?local=true", port: 9200 }
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
        - { name: data, mountPath: /usr/share/elasticsearch/data }
  volumeClaimTemplates:
  - metadata: { name: data }
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources: { requests: { storage: 60Gi } }
