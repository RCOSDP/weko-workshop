# kind multi-node cluster for weko3
# 1 control-plane + 2 workers (one of them labelled nodeType=WEKO for the weko workload)
# Ports 80/443 of the control-plane are published to the host so ingress-nginx can serve traffic
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: weko3
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    # Node hosting the weko3 application (web/nginx/worker); labelled nodeType=WEKO
    labels:
      nodeType: WEKO
  - role: worker
    # Node for the backends (postgres/elasticsearch/redis/rabbitmq)
    labels:
      nodeType: DATA
