# MinIO: S3-compatible object storage (equivalent to JAIRO Cloud's OCI Object Storage)
# Used for backups (pg_dump / ES snapshots / content) and as weko's S3 target
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: weko3
type: Opaque
stringData:
  MINIO_ROOT_USER: wekominio
  MINIO_ROOT_PASSWORD: wekominio-secret-key
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: weko3
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: standard
  resources:
    requests:
      storage: 600Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: weko3
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      nodeSelector: { nodeType: DATA }
      containers:
      - name: minio
        image: minio/minio:RELEASE.2025-04-08T15-41-24Z
        args: ["server", "/data", "--console-address", ":9001"]
        envFrom:
        - secretRef: { name: minio-secret }
        ports:
        - { containerPort: 9000, name: api }
        - { containerPort: 9001, name: console }
        resources:
          requests: { memory: "256Mi", cpu: "100m" }
          limits:   { memory: "1Gi",   cpu: "2" }
        readinessProbe:
          httpGet: { path: /minio/health/ready, port: 9000 }
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - { name: data, mountPath: /data }
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: weko3
spec:
  selector: { app: minio }
  ports:
  - { name: api, port: 9000, targetPort: 9000 }
  - { name: console, port: 9001, targetPort: 9001 }
