# WEKO3 独自属性の SAML エンコード規則 / SAML encoding rules for the WEKO3-specific attributes.
# OID は WEKO の SP 側 attribute-map (weko-k8s の shibboleth_template) と同じものを使う。
# The OIDs match the ones used by WEKO's SP-side attribute-map (weko-k8s' shibboleth_template).
#
# 1 ファイル 1 属性なので wekoSocietyAffiliation は weko-society-affiliation.properties に分けている。
# One attribute per file, so wekoSocietyAffiliation lives in weko-society-affiliation.properties.
id=wekoId
transcoder=SAML2StringTranscoder
saml2.name=urn:oid:1.3.6.1.4.1.32264.2.1.1
displayName.en=WEKO ID
displayName.ja=WEKO ID
