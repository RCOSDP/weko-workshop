# 学認mAP のグループ所属を表す属性 (eduMember)。本番では SP が SimpleAggregation で mAP の
# 属性認証局に問い合わせて取得する。ここでは同じ IdP が属性認証局を兼ねる。
# The eduMember attribute carrying GakuNin mAP group membership. In production the SP fetches it from
# the mAP attribute authority via SimpleAggregation; here the same IdP doubles as that authority.
#
# SP 側のマッピング (id=isMemberOf) はイメージ同梱の /etc/shibboleth/attribute-map.xml に既にある。
# The SP-side mapping (id=isMemberOf) already exists in the image's /etc/shibboleth/attribute-map.xml.
id=isMemberOf
transcoder=SAML2StringTranscoder
saml2.name=urn:oid:1.3.6.1.4.1.5923.1.5.1.1
displayName.en=Group membership
displayName.ja=所属グループ
