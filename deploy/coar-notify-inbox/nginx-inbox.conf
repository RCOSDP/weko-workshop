# Add these to the nginx configuration that already fronts WEKO -- on
# this deployment that is the weko-nginx-pvc volume mounted
# at /etc/nginx, so the file is edited there rather than built into the
# image.
#
# They are the same two rules the docker-compose stack has in
# nginx/weko.conf, with the upstream pointed at the Service instead of a
# compose service name.
#
# Why nginx has to carry them: WEKO announces its inbox to the world as
#   Link: <https://<your site>/inbox>; rel="http://www.w3.org/ns/ldp#inbox"
# and a sender -- another repository, or the e2e suite -- goes to that
# URL.  Inside the cluster WEKO reaches the inbox directly on
# http://weko-inbox:8080; those are two different paths to
# the same service and both are needed.

# Beside the other upstream blocks, at the top of the http context.
upstream inbox_server {
  server weko-inbox.weko3.svc.cluster.local:8080;
}

# Inside the server block that serves WEKO.
location ~ ^/inbox/(.+) {
  proxy_pass http://inbox_server;
  proxy_set_header Host $http_host;
}

location ~ ^/inbox/?$ {
  # The container of the inbox itself: a sender may only POST to it.
  limit_except POST {
    deny all;
  }
  proxy_pass http://inbox_server;
  proxy_set_header Host $http_host;
}
