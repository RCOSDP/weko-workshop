# Copy to secret.yaml, fill it in, and keep it out of git.
#
# MONGO_DB_URI carries the same user and password as the two
# MONGO_INITDB_ROOT_* values, and names the Service in mongo.yaml:
#
#     mongodb://<user>:<password>@repository-ren-ng-mongo:27017
#
# The VAPID pair is what the inbox signs a Web Push with. Leave both
# empty and notifications still work -- the inbox simply sends no push.
# To make a pair (any machine with python-cryptography):
#
#     python3 -c "
#     import base64
#     from cryptography.hazmat.primitives.asymmetric import ec
#     from cryptography.hazmat.primitives import serialization
#     k = ec.generate_private_key(ec.SECP256R1())
#     b = lambda r: base64.urlsafe_b64encode(r).rstrip(b'=').decode()
#     print('public :', b(k.public_key().public_bytes(
#         serialization.Encoding.X962,
#         serialization.PublicFormat.UncompressedPoint)))
#     print('private:', b(k.private_numbers().private_value.to_bytes(32, 'big')))
#     "
#
# Keep the pair once it is in use: it is the identity browsers have
# subscribed against, and changing it silences every subscription.
---
apiVersion: v1
kind: Secret
metadata:
  name: repository-ren-ng-inbox-secret
  namespace: weko3
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: inbox
  MONGO_INITDB_ROOT_PASSWORD: CHANGE-ME
  MONGO_DB_URI: mongodb://inbox:CHANGE-ME@repository-ren-ng-mongo:27017
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
