# What WEKO needs to know about the inbox, for the instance
# configuration -- on this deployment, the jinja2 template the init
# container renders:
#
#     /home/invenio/.virtualenvs/invenio/var/instance/conf/instance.cfg
#
# on the repository-ren-ng-config-pvc volume. Look at the end of that
# file first: if it holds plain Python lines, append these; if it fills
# values from {{ ENVIRONMENT_VARIABLES }}, put them in
# repository-ren-ng-configmap instead and add the lines that read them.
#
# Then restart, which re-runs the init container and re-renders the file:
#
#     kubectl rollout restart deployment/repository-ren-ng-web -n weko3

WEKO_NOTIFICATIONS = True

# The Service in inbox.yaml. WEKO talks to it inside the cluster, so this
# is not the public URL -- that one is nginx's job, see nginx-inbox.conf.
WEKO_NOTIFICATIONS_INBOX_ADDRESS = 'http://repository-ren-ng-inbox:8080'
WEKO_NOTIFICATIONS_INBOX_ENDPOINT = '/inbox'

# Where the message texts a Web Push is rendered from live, inside the
# web container. Check the path against the image: it is the one the
# compose stack uses, and it moves with the checkout.
WEKO_NOTIFICATIONS_PUSH_TEMPLATE_PATH = '/code/modules/weko-notifications/weko_notifications/templates/weko_notifications/push.json'
